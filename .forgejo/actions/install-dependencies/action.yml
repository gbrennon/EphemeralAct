name: Install dependencies
description: Install project dependencies

runs:
  using: composite

  steps:
    - name: Install system packages
      shell: bash
      run: apt-get update && apt-get install -y bash git curl

    - name: Install just
      shell: bash
      run: |
        if command -v just >/dev/null 2>&1; then
          echo "just already installed: $(just --version)"
          exit 0
        fi

        arch=$(uname -m)
        case "$arch" in
          x86_64) target="x86_64-unknown-linux-musl" ;;
          aarch64) target="aarch64-unknown-linux-musl" ;;
          *)
            echo "unsupported architecture: $arch" >&2
            exit 1
            ;;
        esac

        curl -fsSL --proto '=https' --tlsv1.2 \
          -o /tmp/just.tar.gz \
          "https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-${target}.tar.gz"
        tar -xzf /tmp/just.tar.gz -C /tmp just
        install -m 0755 /tmp/just /usr/local/bin/just
        rm -f /tmp/just.tar.gz /tmp/just
        just --version

    - name: Install Rust toolchain
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --default-toolchain stable --profile default
          rm -f /tmp/rustup-init.sh
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add rustfmt clippy
        rustc --version
        cargo --version

    - name: Install cargo-llvm-cov
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if command -v cargo-llvm-cov >/dev/null 2>&1; then
          echo "cargo-llvm-cov already installed: $(cargo llvm-cov --version)"
          exit 0
        fi

        arch=$(uname -m)
        case "$arch" in
          x86_64) target="x86_64-unknown-linux-gnu" ;;
          aarch64) target="aarch64-unknown-linux-gnu" ;;
          *)
            echo "unsupported architecture: $arch" >&2
            exit 1
            ;;
        esac

        curl -fsSL --proto '=https' --tlsv1.2 \
          -o /tmp/cargo-llvm-cov.tar.gz \
          "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-${target}.tar.gz"
        tar -xzf /tmp/cargo-llvm-cov.tar.gz -C "$HOME/.cargo/bin"
        rm -f /tmp/cargo-llvm-cov.tar.gz
        "$HOME/.cargo/bin/cargo" llvm-cov --version
