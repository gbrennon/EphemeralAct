name: Build

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: codeberg-medium
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephact-release
          rustc-version: stable
          include-sysroot: "false"
      - name: Build release binary
        run: cargo build --release --locked
        timeout-minutes: 15
      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp target/release/ephact artifacts/ephact
          chmod +x artifacts/ephact
          tar -czf artifacts/ephact.tar.gz -C artifacts ephact
      - name: Upload artifact
        run: |
          echo "Artifact created:"
          ls -la artifacts/ephact.tar.gz || echo "No artifact found"
