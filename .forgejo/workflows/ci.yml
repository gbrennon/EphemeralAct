name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6

      - uses: ./.forgejo/actions/install-dependencies

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - uses: ./.forgejo/actions/run-tests

  lint:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6

      - uses: ./.forgejo/actions/install-dependencies

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: just fmt-check

      - name: Lint
        run: just lint

  validate:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          mkdir -p ~/.local/bin
          curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          mv actionlint ~/.local/bin/

      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do
            [ -f "$f" ] && shellcheck --external-sources -S info "$f"
          done

      - name: Lint Forgejo Actions workflows
        run: |
          PATH="$HOME/.local/bin:$PATH"
          actionlint -config-file .actionlint.yaml .forgejo/workflows/*.yml
