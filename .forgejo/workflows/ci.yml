name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: docker
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"

      - name: Run tests
        run: cargo test --locked --verbose
        timeout-minutes: 10

      - name: Run doc tests
        run: cargo test --doc --locked
        timeout-minutes: 5

  lint:
    name: Lint
    runs-on: docker
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable && rustup component add clippy
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  coverage:
    name: Coverage
    runs-on: docker
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act-coverage
          rustc-version: stable
          include-sysroot: "false"

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --locked --out Xml --timeout 300
        timeout-minutes: 15

      - name: Upload to Codecov
        run: |
          if [ -f ./cobertura.xml ]; then
            bash <(curl -s https://codecov.io/bash) -f ./cobertura.xml || echo "Codecov upload skipped (no token)"
          else
            echo "No coverage file found, skipping upload"
          fi

  build:
    name: Build
    runs-on: docker
    needs: [test, lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act-release
          rustc-version: stable
          include-sysroot: "false"

      - name: Build release binary
        run: cargo build --release --locked
        timeout-minutes: 15

      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp target/release/ephemeral_act artifacts/
          chmod +x artifacts/ephemeral_act
          tar -czf artifacts/ephemeral-act.tar.gz -C artifacts ephemeral_act
      - name: Upload artifact
        run: |
          echo "Artifact created:"
          ls -la artifacts/ephemeral-act-*.tar.gz || echo "No artifact found"
