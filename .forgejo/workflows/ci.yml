name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: codeberg-medium
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"
      - uses: ./.forgejo/actions/run-tests

  lint:
    name: Lint
    runs-on: codeberg-medium
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act
          rustc-version: stable
          include-sysroot: "false"
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build
    runs-on: codeberg-medium
    needs: [test, lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - uses: ./.forgejo/actions/cache-rust-deps
        with:
          cache-key-prefix: ephemeral-act-release
          rustc-version: stable
          include-sysroot: "false"
      - name: Build release binary
        run: cargo build --release --locked
        timeout-minutes: 15
      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp target/release/ephemeral_act artifacts/
          chmod +x artifacts/ephemeral_act
          tar -czf artifacts/ephemeral-act.tar.gz -C artifacts ephemeral_act
      - name: Upload artifact
        run: |
          echo "Artifact created:"
          ls -la artifacts/ephemeral-act-*.tar.gz || echo "No artifact found"
