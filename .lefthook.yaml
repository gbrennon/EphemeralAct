# EphemeralAct lefthook configuration
# Install: pipx install lefthook && lefthook install

pre-commit:
  parallel: false
  jobs:
    - name: Auto-fix staged files
      run: |
        set -eu
        STAGED_RUST_FILES=$(git diff --cached --name-only --diff-filter=ACM | { grep -E '\.rs$' || true; } | tr '\n' ' ')
        if [ -n "$STAGED_RUST_FILES" ]; then
          just fmt -- $STAGED_RUST_FILES
        fi
        just lint-fix

    - name: Check for auto-fixed files
      run: |
        set -eu
        STAGED_FILES=$(git diff --cached --name-only --diff-filter=ACM | tr '\n' ' ')
        if [ -n "$STAGED_FILES" ] && ! git diff --quiet -- $STAGED_FILES; then
          echo "Auto-fixed files detected. Run: git add -A && git commit --amend --no-edit"
        fi
