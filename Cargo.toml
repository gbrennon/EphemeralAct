[package]
name = "ephemeral_act"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
bollard = "0.21.0"
tokio = { version = "1.53.1", features = ["full"] }
tar = "0.4.46"
futures-util = "0.3.33"
libc = "0.2.189"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "core_services_run_act_service"
path = "tests/core/services/run_act_service_tests.rs"

[[test]]
name = "infrastructure_act_wrappers"
path = "tests/infrastructure/act_wrappers_tests.rs"
